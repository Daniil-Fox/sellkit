<div class="modal" data-mouse-blue role="dialog" aria-labelledby="modal-title" aria-modal="true">
  <div class="modal__body">
    <button class="btn-reset modal__close" aria-label="Закрыть модальное окно" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
        role="img">
        <path d="M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M1 1L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div class="modal__content">
      <h2 class="title2 title2--white cta__title" id="modal-title">
        Давайте покажем, как&nbsp;все&nbsp;работает
      </h2>
      <form method="POST" action="#" class="modal__form form" data-form itemscope
        itemtype="https://schema.org/Organization">
        <meta itemprop="name" content="SellKit" />
        <meta itemprop="description" content="Система автоматизации ресторанного бизнеса" />
        <div itemprop="contactPoint" itemscope itemtype="https://schema.org/ContactPoint">
          <meta itemprop="contactType" content="sales" />
          <meta itemprop="availableLanguage" content="Russian" />
          <div class="form__fields">
            <div class="form__field">
              <input type="text" placeholder="Ваше имя" name="ur-name" class="form__input input-name"
                aria-label="Введите ваше имя" required />
            </div>
            <div class="form__field">
              <input type="tel" placeholder="Номер телефона" name="ur-phone" class="form__input input-tel"
                itemprop="telephone" aria-label="Введите номер телефона" pattern="[0-9+\s-()]+" required />
            </div>
            <div class="form__field">
              <input type="text" placeholder="Название проекта" name="ur-rest" class="form__input input-project"
                aria-label="Введите название проекта" required />
            </div>
            <div class="form__field">
              <input type="text" placeholder="Город" name="ur-city" class="form__input input-city" itemprop="areaServed"
                aria-label="Введите ваш город" required />
            </div>
          </div>
        </div>
        <button type="submit" class="btn-reset btn btn--white form__btn">
          продолжить
        </button>
        <small class="form__agree">
          Нажимая кнопку «Продолжить», вы принимаете
          <a href="/privacy-policy.html" target="_blank" rel="noopener noreferrer" itemprop="termsOfService">политику
            обработки персональных данных</a>
        </small>
      </form>
    </div>
    <div class="modal__thankyou">
      <div class="modal__img">
        <svg width="460" height="172" viewBox="0 0 446 162" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"

      </div>
      <p class="title2 title2--white modal__capture">
        Спасибо за заявку! свяжемся с&nbsp;вами в&nbsp;ближайшее время.
      </p>
    </div>
  </div>

</div>
