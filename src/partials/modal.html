<div class="modal" data-mouse-blue>
  <div class="modal__body">
    <button class="btn-reset modal__close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 1L1 17" stroke="#001840" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M1 1L17 17" stroke="#001840" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div class="modal__content">
      <h2 class="title2 title2--white cta__title" id="cta-title" itemprop="headline">
        Давайте покажем, как&nbsp;все&nbsp;работает
      </h2>
      <form action="#" class="cta__form form" itemscope itemtype="https://schema.org/ContactForm">
        <meta itemprop="name" content="Форма запроса демонстрации SellKit">
        <div class="form__fields">
          <input type="text" placeholder="Ваше имя" name="Имя" class="form__input" itemprop="name"
            aria-label="Введите ваше имя" required />
          <input type="tel" placeholder="Номер телефона" name="Телефон" class="form__input" itemprop="telephone"
            aria-label="Введите номер телефона" required />
          <input type="text" placeholder="Название проекта" name="Название проекта" class="form__input"
            itemprop="subjectOf" aria-label="Введите название проекта" required />
          <input type="text" placeholder="Город" name="Город" class="form__input" itemprop="addressLocality"
            aria-label="Введите ваш город" required />
        </div>
        <button class="btn-reset btn btn--white form__btn" itemprop="actionableFeedbackPolicy">продолжить</button>
        <small class="form__agree">
          Нажимая кнопку "Продолжить", вы&nbsp;принимаете
          <a href="#" itemprop="termsOfService">политику обработки персональных данных</a>
        </small>
      </form>
    </div>
  </div>
</div>
