<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#111111" />

  <!-- Предварительные подключения для ускорения загрузки ресурсов -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.google-analytics.com" />
  <link rel="preconnect" href="https://mc.yandex.ru" />

  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

  <title>SellKit - комплексное решение для ресторанного бизнеса</title>
  <meta name="description"
    content="SellKit - профессиональное программное обеспечение для автоматизации ресторанного бизнеса: сайт, мобильное приложение, система лояльности и аналитика." />
  <meta name="keywords"
    content="sellkit, автоматизация ресторана, доставка еды, мобильное приложение для ресторана, система лояльности, курьерский софт, iiko партнер" />
  <meta name="author" content="SellKit" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph соц. сети -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sellkit.ru/" />
  <meta property="og:title" content="SellKit - комплексное решение для ресторанного бизнеса" />
  <meta property="og:description"
    content="Автоматизация ресторанного бизнеса: сайт доставки, мобильное приложение, система лояльности и маркетинговая CRM." />
  <meta property="og:image" content="./img/og-image.jpg" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://sellkit.ru/" />

  <!-- Критические шрифты - только самые необходимые для первого отображения -->
  <link rel="preload" href="fonts/BebasNeueCyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Некритичные шрифты - загрузятся с низким приоритетом -->
  <link rel="preload" href="fonts/BebasNeueRegular.woff2" as="font" type="font/woff2" crossorigin media="print"
    onload="this.media='all'" />
  <link rel="preload" href="fonts/BebasNeueBold.woff2" as="font" type="font/woff2" crossorigin media="print"
    onload="this.media='all'" />
  <link rel="preload" href="fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin media="print"
    onload="this.media='all'" />
  <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin media="print"
    onload="this.media='all'" />

  <!-- Предзагрузка критического изображения для первого экрана -->
  <link rel="preload" as="image" href="./img/hero-mob.webp" imagesrcset="./img/hero-mob.webp"
    media="(max-width: 768px)">

  <!-- Добавление font-display: swap для всех шрифтов -->
  <style>
    @font-face {
      font-family: 'BebasNeueCyrillic';
      font-display: swap;
      src: url('fonts/BebasNeueCyrillic.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Inter';
      font-display: swap;
      src: url('fonts/Inter-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Inter';
      font-display: swap;
      src: url('fonts/Inter-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SellKit",
    "url": "https://sellkit.ru/",
    "logo": "https://sellkit.ru/img/logo.svg",
    "description": "Комплексное решение для автоматизации ресторанного бизнеса",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "Россия"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+7 (988) 565 00 38",
      "contactType": "customer service"
    },
    "sameAs": [
      "https://t.me/sellkit",
      "https://vk.com/sellkit"
    ]
  }
  </script>

  <!-- Критические стили и скрипты -->
  <link rel="stylesheet" href="css/vendor.css" />
  <link rel="stylesheet" href="css/main.css" />
  <script defer src="js/main.js"></script>
</head>
